# Called once by push delivery, and directly for pull requests. The backend builds the SPA into wwwroot,
# which the SPA-serving E2E tests read.
name: ci

on:
  pull_request:
  workflow_call:
    inputs:
      commit:
        description: Immutable commit selected by the delivery workflow
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engineering/codebase/wheelhouse.backend-services/global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: engineering/codebase/wheelhouse.frontend-services/.nvmrc
      - run: npm install --global pnpm@10.33.2
      # Unit, integration, E2E and migration tiers; Testcontainers uses the runner's Docker.
      - run: dotnet test engineering/codebase/wheelhouse.backend-services/Wheelhouse.BackendServices.slnx

  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      # The bundle contract test runs the release generator at the tag the publish workflow pins.
      - uses: actions/checkout@v4
        with:
          repository: wow-two-platform/wow-two-platform.pipelines
          ref: v0.1.0
          path: .pipelines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python -m unittest discover -s engineering/codebase/wheelhouse.runner-services -v
        env:
          WHEELHOUSE_PIPELINES: ${{ github.workspace }}/.pipelines
      - name: Verify VPS bootstrap without changing a host
        run: |
          python -m unittest discover -s engineering/deployment/vps -v
          bash -n engineering/deployment/vps/bootstrap.sh
          WHEELHOUSE_DEPLOY_UID=1000 WHEELHOUSE_DEPLOY_GID=1000 docker compose -f engineering/deployment/vps/platform.compose.yml config --quiet

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engineering/codebase/wheelhouse.frontend-services
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: engineering/codebase/wheelhouse.frontend-services/.nvmrc
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Type-checks every component, then builds the production bundle.
      - run: pnpm build
