# Only the tested, published main-push workflow calls this. No independent push/release trigger.
# The fallback since Wheelhouse deploys itself (decision 64): the repository variable WHEELHOUSE_SELF_DEPLOY=true turns
# it off, as Wheelhouse prod then deploys each release to dev; false or unset keeps it on (deployment.md § Fallback).
name: deploy-dev

on:
  workflow_call:

permissions:
  contents: read

jobs:
  self-deploy:
    if: vars.WHEELHOUSE_SELF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report that Wheelhouse deploys itself
        run: |
          echo 'Wheelhouse prod deploys this release to wheelhouse-dev itself (WHEELHOUSE_SELF_DEPLOY=true); CI reaches no host.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: vars.WHEELHOUSE_SELF_DEPLOY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - name: Report incomplete host wiring
        if: vars.DEV_DEPLOY_ENABLED != 'true'
        run: |
          echo 'Dev deployment is not enabled: complete engineering/deployment/vps/vps.md and set DEV_DEPLOY_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: vars.DEV_DEPLOY_ENABLED == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        if: vars.DEV_DEPLOY_ENABLED == 'true'
        with:
          repository: wow-two-platform/wow-two-platform.pipelines
          ref: v0.11.0
          path: .pipelines
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: vars.DEV_DEPLOY_ENABLED == 'true'
        with:
          python-version: '3.12'
      - run: pip install pyyaml
        if: vars.DEV_DEPLOY_ENABLED == 'true'
      - name: Deploy the verified bundle over pinned SSH
        if: vars.DEV_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WHEELHOUSE_SELF_DEPLOY: ${{ vars.WHEELHOUSE_SELF_DEPLOY }}
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: python3 engineering/codebase/wheelhouse.runner-services/ci_deploy.py
