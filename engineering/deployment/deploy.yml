# yaml-language-server: $schema=../../../../../conventions/deployment/descriptor/deploy.schema.json
# Wheelhouse ships like the products it deploys: this descriptor feeds the shared publish workflow and the runner.
# Format: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md
descriptor: 1
product: wheelhouse
# What the console and every other reader call it (pipelines v0.11.0); it replaced product/product.json.
name: Wheelhouse
description: The portfolio's deploy and operations control plane.
homepage: https://github.com/wow-two-platform/wow-two-platform.wheelhouse
platform: linux/amd64
# Dev runs as .NET Development, prod as Production; appsettings.Development.json holds no machine-local value.
dotnetEnvironment: true
shared:
  - deployment/Dockerfile
services:
  console:
    build:
      dockerfile: deployment/Dockerfile
      # The products-host kit, copied into the image at /app/kit for enrollments.
      contexts:
        kit: deployment/vps
    paths:
      - codebase/wheelhouse.backend-services/**
      - codebase/wheelhouse.frontend-services/**
      - codebase/wheelhouse.runner-services/**
      - deployment/vps/*.sh
      - deployment/vps/prepare.py
      - deployment/vps/products.compose.yml
      - deployment/vps/tailscale-serve-products.json
      - deployment/vps/tailnet-policy.hujson
    health: /api/system/ready
    memory: 512m
    settings:
      required:
        - ConnectionStrings:Wheelhouse
        - Identity:GitHub:ClientId
        - Identity:GitHub:ClientSecret
        - Identity:AllowedGitHubLogins
    volumes:
      keys: /data/keys
      deployments: /data/deployments
    needs: [postgres]
    sites:
      console: { exposure: private }
# The migrate step (pipelines v0.12.0): on every forward deploy, after the pull and before the console restarts, the
# runner runs the console image's bare `migrate` (apply, then seed) in a one-off container with the console's settings.
# A deployed console only checks its database at boot; a return to an older release runs that release's
# `migrate check` first.
migrate:
  - service: console
    command: [dotnet, Wheelhouse.Api.dll, migrate]
# Dev only, after each wheelhouse-dev rollout: readiness, status and an anonymous MCP initialization the console must
# refuse, asked of the new console from its own image on its network. CI ran these after its deploys; the runner runs
# them now that Wheelhouse prod deploys dev (decision 64). A failure warns on the rollout and never changes it.
verify:
  service: console
  command: [python3, /app/runner/self_check.py]
  timeout: 60s
