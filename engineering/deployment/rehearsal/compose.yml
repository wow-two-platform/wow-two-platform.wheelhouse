# The local server: an SSH target driving the host Docker daemon, an ingress, a registry, a product database,
# an optional vault, and the Wheelhouse console itself (`rehearse.py console`).
# Settings live at the same absolute path inside the target and on the host, so bind sources resolve.
name: wheelhouse-rehearsal
services:
  target:
    build: .
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REHEARSAL_STATE:?Set REHEARSAL_STATE}/keys:/rehearsal-keys
      - ${REHEARSAL_STATE}/secrets:${REHEARSAL_STATE}/secrets:ro
      # The settings Wheelhouse renders at each deploy, at the same path, so the daemon resolves their bind sources.
      - ${REHEARSAL_STATE}/settings:${REHEARSAL_STATE}/settings
      - deployments:/srv/wheelhouse
    restart: unless-stopped
  # The local server's ingress: Traefik reads the runner's route files, as on a VPS, and answers every
  # environment's sites at <site>-<product>.<environment>.localhost:18080.
  ingress:
    image: traefik:v3.5
    command:
      - --providers.file.directory=/srv/wheelhouse/ingress
      - --providers.file.watch=true
      - --entryPoints.web.address=:80
      - --log.level=ERROR
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - deployments:/srv/wheelhouse:ro
    networks:
      default: {}
      platform: {}
    depends_on: [target]
    restart: unless-stopped
  registry:
    image: registry:2
    ports:
      - "127.0.0.1:15000:5000"
    restart: unless-stopped
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foreverpin
      POSTGRES_USER: foreverpin
      POSTGRES_PASSWORD_FILE: /run/rehearsal/database-password
    volumes:
      - ${REHEARSAL_STATE}/secrets/database-password:/run/rehearsal/database-password:ro
      - database:/var/lib/postgresql/data
    networks:
      default: {}
      platform:
        aliases: [rehearsal-database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreverpin -d foreverpin"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  # A real secrets vault for the console; needs a locally built secrets-vault:local image.
  vault:
    image: secrets-vault:local
    profiles: [vault]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      VAULT_MASTER_KEY_FILE: /run/secrets/master_key
      VAULT_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      VAULT_ADMIN_JWT_KEY_FILE: /run/secrets/jwt_key
      DB_CONNECTION_FILE: /run/secrets/db_connection
    volumes:
      - ${REHEARSAL_STATE}/vault/master_key:/run/secrets/master_key:ro
      - ${REHEARSAL_STATE}/vault/admin_password_hash:/run/secrets/admin_password_hash:ro
      - ${REHEARSAL_STATE}/vault/jwt_key:/run/secrets/jwt_key:ro
      - ${REHEARSAL_STATE}/vault/db_connection:/run/secrets/db_connection:ro
    ports:
      - "127.0.0.1:18201:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      vault-db:
        condition: service_healthy
    restart: unless-stopped
  vault-db:
    image: postgres:16-alpine
    profiles: [vault]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    volumes:
      - ${REHEARSAL_STATE}/vault/db_admin_password:/run/secrets/db_admin_password:ro
      - ${REHEARSAL_STATE}/vault/db_init.sql:/docker-entrypoint-initdb.d/10-vault.sql:ro
      - vault-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secrets_vault"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  # Wheelhouse itself, built as it ships, driving this rig over SSH the way it will drive a VPS.
  console:
    image: wheelhouse:local
    build:
      context: ../../codebase
      dockerfile: ../deployment/Dockerfile
      # The products-host kit the image carries for enrollments, as deploy.yml names it.
      additional_contexts:
        kit: ../vps
    profiles: [console]
    environment:
      Deployment__Rehearsal: network
      Deployment__RehearsalState: ${REHEARSAL_STATE}
    volumes:
      - ${REHEARSAL_STATE}/inventory:/data/deployments
      - ${REHEARSAL_STATE}/console/appsettings.Target.json:/app/appsettings.Target.json:ro
      - console-keys:/data/keys
    ports:
      - "127.0.0.1:18210:8080"
    depends_on:
      console-db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
  console-db:
    image: postgres:16-alpine
    profiles: [console]
    environment:
      POSTGRES_DB: wheelhouse
      POSTGRES_USER: wheelhouse
      POSTGRES_PASSWORD_FILE: /run/console/database-password
    volumes:
      - ${REHEARSAL_STATE}/console/database-password:/run/console/database-password:ro
      - console-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelhouse -d wheelhouse"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  # A products host for `rehearse.py products`: its own Docker daemon (privileged, like any Docker-in-Docker), laid
  # out by bootstrap-products.sh's own steps and driven over SSH at 127.0.0.1:2223, as Wheelhouse drives a second VPS.
  products:
    build:
      context: .
      dockerfile: Dockerfile.products
    profiles: [products]
    privileged: true
    environment:
      PRODUCTS_TAILNET_ADDRESS: 100.88.0.1
    ports:
      - "127.0.0.1:2223:22"
    volumes:
      - ../vps:/kit:ro
      - ${REHEARSAL_STATE}/products/keys:/rehearsal-keys
      - products-docker:/var/lib/docker
      - products-root:/srv/wheelhouse
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 && pgrep sshd >/dev/null"]
      interval: 2s
      retries: 60
    depends_on: [registry]
    restart: unless-stopped
  # The database for Wheelhouse run from an IDE (appsettings.Local.json); loopback-only dev credentials.
  dev-db:
    image: postgres:16-alpine
    profiles: [dev]
    environment:
      POSTGRES_DB: wheelhouse
      POSTGRES_USER: wheelhouse
      POSTGRES_PASSWORD: wheelhouse
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelhouse -d wheelhouse"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  # `rehearse.py enroll`: a fresh root-only Ubuntu 26.04 VPS that the console's own runner enrolls, from the console
  # image, against a fake Tailscale API. rig-public stands in for the internet, rig-tailnet for the tailnet (the host's
  # interface on it is named tailscale0, as UFW's rules expect).
  fresh:
    build:
      context: .
      dockerfile: Dockerfile.fresh
    profiles: [enroll]
    privileged: true
    tmpfs: [/run, /run/lock]
    volumes:
      - ${REHEARSAL_STATE}/enroll/fresh-root-keys:/rig/authorized_keys:ro
      - fresh-docker:/var/lib/docker
      - fresh-containerd:/var/lib/containerd
    networks:
      rig-public:
        ipv4_address: 172.31.250.10
      rig-tailnet:
        ipv4_address: 100.88.1.10
        interface_name: tailscale0
  fake-tailscale:
    image: python:3.12-alpine
    profiles: [enroll]
    command: [python3, /rig/fake_tailscale.py, --port, "8080", --client-file, /rig-client/oauth-client.json,
              --policy-file, /kit/tailnet-policy.hujson, --control-address, 100.88.1.2]
    volumes:
      - ./fake_tailscale.py:/rig/fake_tailscale.py:ro
      - ${REHEARSAL_STATE}/enroll/root/providers/tailscale:/rig-client:ro
      - ../vps:/kit:ro
    networks:
      rig-public:
        ipv4_address: 172.31.250.5
  # Wheelhouse's runner as it ships in the console image, with its own runner root; `rehearse.py enroll` runs its
  # infra.py and transport.py actions here, the way the console runs them.
  enroller:
    image: wheelhouse:local
    profiles: [enroll]
    entrypoint: [python3]
    environment:
      WHEELHOUSE_REHEARSAL: network
      WHEELHOUSE_TAILSCALE_API: http://fake-tailscale:8080
    volumes:
      - ${REHEARSAL_STATE}/enroll/root:/data/deployments
    networks:
      rig-public: {}
      rig-tailnet:
        ipv4_address: 100.88.1.2
networks:
  platform:
    name: wheelhouse-rehearsal
  rig-public:
    name: wheelhouse-rig-public
    ipam:
      config: [{ subnet: 172.31.250.0/24 }]
  rig-tailnet:
    name: wheelhouse-rig-tailnet
    internal: true
    ipam:
      config: [{ subnet: 100.88.1.0/24 }]
volumes:
  deployments:
  database:
  vault-db:
  console-db:
  console-keys:
  dev-db:
  products-docker:
  products-root:
  fresh-docker:
  fresh-containerd:
