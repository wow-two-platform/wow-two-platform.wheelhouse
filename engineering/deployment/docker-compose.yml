# Local verification only. Production uses an externally managed PostgreSQL.
services:
  # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker; the volume names its major, so a stack left on 16
  # starts 18 on a new, empty volume and keeps the old one.
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wheelhouse
      POSTGRES_USER: wheelhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelhouse -d wheelhouse"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # The migrate step, as a rollout runs it: the image's bare `migrate`, once, before the console starts. A console
  # outside a local run only checks its database at boot.
  migrate:
    image: wheelhouse:local
    build: &wheelhouse-build
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
      additional_contexts:
        kit: vps
    entrypoint: [dotnet, Wheelhouse.Api.dll, migrate]
    environment:
      DB_CONNECTION: "Host=database;Database=wheelhouse;Username=wheelhouse;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  wheelhouse:
    image: wheelhouse:local
    build: *wheelhouse-build
    ports:
      - "127.0.0.1:${WHEELHOUSE_PORT:-8211}:8080"
    environment:
      DB_CONNECTION: "Host=database;Database=wheelhouse;Username=wheelhouse;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      Identity__AllowedGitHubLogins__0: ${WHEELHOUSE_ADMIN:?Set WHEELHOUSE_ADMIN}
    volumes:
      - keys:/data/keys
      - deployments:/data/deployments
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  database-pg18:
  keys:
  deployments:
