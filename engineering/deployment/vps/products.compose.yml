# Products host platform only: PostgreSQL, a Traefik ingress (private, and public on 80 and 443) and one tailnet node per
# private site. No console and no Wheelhouse database run here; Wheelhouse prod's runner deploys each product from its
# release bundle.
# bootstrap-products.sh installs this template as platform/products.compose.yml. `prepare.py --server products` renders
# platform/compose.yml from it plus the site nodes it registered (platform/sites.json), so run Compose against the
# rendered file. Keep `services:` the last top-level key: the renderer appends each site node beneath it.
name: wheelhouse-products
# One tailnet node per product site and environment gives each its own name and trusted certificate; Serve hands HTTPS
# to Traefik's private entry point, which routes by that name. A node's auth key is read only at first login: the
# single-use key Wheelhouse minted for it (private/sites/<node>.env, rendered in per node) or, by hand, the operator's
# reusable one. Each node keeps its state in platform/sites/<node>/.
x-site-node: &site-node
  image: tailscale/tailscale:v1.104.1
  env_file:
    - path: ../private/tailscale-sites.env
      required: false
  environment: &site-env
    TS_STATE_DIR: /var/lib/tailscale
    TS_USERSPACE: "true"
    TS_AUTH_ONCE: "true"
    TS_EXTRA_ARGS: --advertise-tags=tag:product-site
    TS_SERVE_CONFIG: /config/serve.json
  mem_limit: 96m
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
# Created by bootstrap-products.sh: 172.30.0.0/24, gateway 172.30.0.1. Fixed addresses stay below .128, where Docker
# hands out workload addresses: PostgreSQL .3, Traefik .2, site nodes 172.30.0.64/26.
networks:
  platform:
    name: platform
    external: true
volumes:
  postgres:
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/bootstrap/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./.secrets/postgres-password:/run/bootstrap/postgres-password:ro
    networks:
      platform:
        ipv4_address: 172.30.0.3
        aliases: [wheelhouse-postgres]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  ingress:
    image: traefik:v3.5
    user: ${WHEELHOUSE_DEPLOY_UID:?Set WHEELHOUSE_DEPLOY_UID}:${WHEELHOUSE_DEPLOY_GID:?Set WHEELHOUSE_DEPLOY_GID}
    command:
      - --providers.file.directory=/etc/traefik/routes
      - --providers.file.watch=true
      # private serves private sites through their tailnet nodes. Forwarded headers are trusted from the host and the
      # site nodes only, never from a workload.
      - --entryPoints.private.address=:8080
      - --entryPoints.private.forwardedHeaders.trustedIPs=127.0.0.1/32,172.30.0.1/32,172.30.0.64/26
      # Public ingress (decision 68): web (host port 80) answers Let's Encrypt's HTTP-01 challenge and sends everything
      # else to https; websecure (host port 443) serves public sites, each router with the letsencrypt resolver. Nothing
      # in front is trusted for forwarded headers. Unprivileged ports inside, so Traefik needs no capability.
      - --entryPoints.web.address=:8081
      - --entryPoints.web.http.redirections.entryPoint.to=:443
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:8443
      - --entryPoints.websecure.http.tls=true
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
      - --certificatesResolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
      # host.env may point it at Let's Encrypt staging for a trial; the local rig points it nowhere.
      - --certificatesResolvers.letsencrypt.acme.caServer=${WHEELHOUSE_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - --ping=true
      - --ping.entryPoint=private
      - --log.level=INFO
    # The only public ports on the host: 80 and 443, for public sites. The private entry point stays on loopback.
    ports:
      - 127.0.0.1:18080:8080
      - 80:8081
      - 443:8443
    volumes:
      - ../ingress:/etc/traefik/routes:ro
      # Certificates and the ACME account, written by Traefik as the deploy account (acme.json, mode 0600).
      - ./acme:/etc/traefik/acme
    networks:
      platform:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
