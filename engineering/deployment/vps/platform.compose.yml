# Host platform only. The product is deployed from its immutable release bundle by runner.py.
# Two networks: `control` holds the consoles, PostgreSQL and Traefik; `platform` holds product and canary workloads,
# which reach PostgreSQL and Traefik but never a console. Console entry points also refuse any source but the host.
name: wheelhouse-platform
# One tailnet node per canary environment (dev, prod) gives each its own name and certificate; Serve hands HTTPS to
# Traefik's canary entry point, which routes by that name. The auth key file is operator-placed and only read at first
# login. The test environment and its canary-test node (172.30.0.11) were retired on 2026-10-17.
x-canary-node: &canary-node
  image: tailscale/tailscale:v1.104.1
  env_file:
    - path: ../private/tailscale-canary.env
      required: false
  environment: &canary-env
    TS_STATE_DIR: /var/lib/tailscale
    TS_USERSPACE: "true"
    TS_AUTH_ONCE: "true"
    TS_EXTRA_ARGS: --advertise-tags=tag:canary
    TS_SERVE_CONFIG: /config/serve.json
  mem_limit: 96m
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/bootstrap/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./.secrets/postgres-password:/run/bootstrap/postgres-password:ro
      - ./.secrets/wheelhouse-dev.sql:/docker-entrypoint-initdb.d/10-wheelhouse-dev.sql:ro
    networks:
      control:
        ipv4_address: 172.30.1.3
        aliases: [wheelhouse-postgres]
      platform:
        ipv4_address: 172.30.0.3
        aliases: [wheelhouse-postgres]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d wheelhouse_dev"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  ingress:
    image: traefik:v3.5
    user: ${WHEELHOUSE_DEPLOY_UID:?Set WHEELHOUSE_DEPLOY_UID}:${WHEELHOUSE_DEPLOY_GID:?Set WHEELHOUSE_DEPLOY_GID}
    command:
      - --providers.file.directory=/etc/traefik/routes
      - --providers.file.watch=true
      # private serves prod on Tailscale HTTPS 443; dev serves Wheelhouse dev on 8443 under the same hostname.
      # Both accept only host-originated traffic (Serve through the published ports), never a workload container.
      - --entryPoints.private.address=:8080
      - --entryPoints.private.forwardedHeaders.trustedIPs=127.0.0.1/32,172.30.0.1/32,172.30.1.1/32
      - --entryPoints.private.http.middlewares=control-only@file
      - --entryPoints.dev.address=:8082
      - --entryPoints.dev.forwardedHeaders.trustedIPs=127.0.0.1/32,172.30.0.1/32,172.30.1.1/32
      - --entryPoints.dev.http.middlewares=control-only@file
      # canary serves only the canary environments, reached through their own tailnet nodes.
      - --entryPoints.canary.address=:8084
      - --entryPoints.canary.forwardedHeaders.trustedIPs=127.0.0.1/32,172.30.0.1/32,172.30.0.10/32,172.30.0.12/32
      - --ping=true
      - --ping.entryPoint=private
      - --log.level=INFO
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:18082:8082
      - 127.0.0.1:18084:8084
    volumes:
      - ../ingress:/etc/traefik/routes:ro
    networks:
      control:
        ipv4_address: 172.30.1.2
      platform:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 128m left no room for the healthcheck's second traefik process beside the cached binary: the page cache
    # thrashed (~130 MB/s of disk reads) and held the host's load near 1 (2026-10-27).
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  canary-dev:
    <<: *canary-node
    hostname: canary-dev
    environment: { <<: *canary-env, TS_HOSTNAME: canary-dev }
    volumes: [canary-dev:/var/lib/tailscale, ./tailscale-serve.json:/config/serve.json:ro]
    networks: { platform: { ipv4_address: 172.30.0.10 } }
  canary:
    <<: *canary-node
    hostname: canary
    environment: { <<: *canary-env, TS_HOSTNAME: canary }
    volumes: [canary:/var/lib/tailscale, ./tailscale-serve.json:/config/serve.json:ro]
    networks: { platform: { ipv4_address: 172.30.0.12 } }
networks:
  control:
    name: control
    external: true
  platform:
    name: platform
    external: true
volumes:
  postgres:
  canary-dev:
  canary:
