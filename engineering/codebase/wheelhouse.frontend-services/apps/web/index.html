<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wheelhouse</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The SDK pre-paint colour script, generated by vite.config.ts: applies the remembered scheme before the first paint. -->
    <script vite-ignore src="/theme.js"></script>
    <link rel="stylesheet" href="/boot-splash.css" />
  </head>
  <body>
    <div id="root">
      <!-- The splash before any script runs; mounting the app replaces it with BootSplash, which looks the same. -->
      <div class="boot-splash" role="status" aria-label="Loading Wheelhouse">
        <img
          class="boot-splash-wordmark-dark"
          src="/src/presentation/shell/assets/wordmark-dark-ink.png"
          alt="Wheelhouse"
          width="288"
          height="40"
        />
        <img
          class="boot-splash-wordmark-light"
          src="/src/presentation/shell/assets/wordmark-light-ink.png"
          alt="Wheelhouse"
          width="288"
          height="40"
        />
        <div class="boot-splash-track"><div class="boot-splash-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap/main.ts"></script>
  </body>
</html>
